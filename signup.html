<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up | Smart Inventory</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f1f5f9;
        }

        .signup-container {
            width: 400px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: purple;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: rgb(204, 11, 204);
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
            color: #334155;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: rgb(134, 2, 134);
        }

        .signup-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: rgb(134, 2, 134);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .signup-btn:hover {
            background: rgb(59, 2, 59);
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            color: #64748b;
        }

        .login-link a {
            color: rgb(204, 11, 204);
            text-decoration: none;
            font-weight: 600;
        }
        .password-container {
    position: relative;
}

.password-container input {
    padding-right: 45px;
}

.toggle-password {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    border: none;
    background: none;
    cursor: pointer;
    font-size: 18px;
}
    </style>
</head>

<body>

    <div class="signup-container">

        <h1>Create Account</h1>

        <p class="subtitle">Smart Inventory Management</p>

        <form id="signupForm" action="signup.php" method="post">

            <div class="form-group">
                <label for="name">Full Name</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="form-group">
    <label for="password">Password</label>

    <div class="password-container">
        <input
            type="password"
            id="password"
            name="password"
            placeholder="Create a password"
            required
        >

        <button
            type="button"
            class="toggle-password"
            onclick="togglePassword('password', this)"
        >👁️</button>
    </div>
</div>

           <div class="form-group">
    <label for="confirmPassword">Confirm Password</label>

    <div class="password-container">
        <input
            type="password"
            id="confirmPassword"
            name="confirmPassword"
            placeholder="Confirm your password"
            required
        >

        <button
            type="button"
            class="toggle-password"
            onclick="togglePassword('confirmPassword', this)"
        >👁️</button>
    </div>
</div>

            <button type="submit" class="signup-btn">
                Create Account
            </button>

        </form>

        <div class="login-link">
            Already have an account?
            <a href="login.html">Login</a>
        </div>

    </div>


    <script src="signup.js"></script>
</body>
</html>
